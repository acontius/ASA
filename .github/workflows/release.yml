name: release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test before packaging
        run: python -m unittest discover -s tests -v
      - name: Build source archive
        run: python tools/build_release_archive.py dist
      - name: Check archive contents
        run: |
          python - <<'PY'
          import tarfile
          with tarfile.open("dist/asa-source.tar.gz", "r:gz") as archive:
              names = archive.getnames()
          blob = "\n".join(names)
          assert "app/vulnerability/cli.py" in names
          assert "PartOfMe.json" not in blob
          assert ".sqlite" not in blob
          assert not any(name.startswith("Data/") or name.startswith("out/") for name in names)
          print("archive-ok", len(names))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: asa-source
          path: |
            dist/asa-source.tar.gz
            dist/asa-source.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: asa-source
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/asa-source.tar.gz dist/asa-source.tar.gz.sha256 \
            --title "${GITHUB_REF_NAME}" \
            --notes "ASA source release. Local CLI only. The archive does not contain scan data or vulnerability databases."
